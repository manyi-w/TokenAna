# Public template; fill actual service model IDs and API base URLs.
# Copy to config/local/deepswe-pilot/settings.toml; keep credentials in secrets.env.
retention_mode = "research" # Default: final workspace delta. "full": per-request snapshots + full container archive.

[models.gpt]
name = "gpt-5.6-sol"
provider = "openai"
model_id = "" # Actual ID accepted by your service
protocol = "responses"
base_url = ""
api_key_env = "OPENAI_API_KEY"
opencode_context_limit = 131072
opencode_output_limit = 8192

[models.claude]
name = "claude-opus-5"
provider = "anthropic"
model_id = "" # Actual ID accepted by your service
protocol = "anthropic_messages"
base_url = ""
api_key_env = "ANTHROPIC_API_KEY"
opencode_context_limit = 131072
opencode_output_limit = 8192

[models.deepseek]
name = "deepseek-v4.1-flash"
provider = "deepseek"
model_id = "" # Actual ID accepted by your service
protocol = "chat_completions"
base_url = ""
api_key_env = "DEEPSEEK_API_KEY"
opencode_context_limit = 131072
opencode_output_limit = 8192

[models.qwen]
name = "qwen3.8-max"
provider = "dashscope"
model_id = "" # Actual ID accepted by your service
protocol = "chat_completions"
base_url = ""
api_key_env = "DASHSCOPE_API_KEY"
opencode_context_limit = 131072
opencode_output_limit = 8192

[models.qwen_coder_next]
name = "Qwen3-Coder-Next"
provider = "openai" # Self-hosted OpenAI-compatible generation; not an OpenAI price claim
model_id = "Qwen3-Coder-Next"
protocol = "chat_completions"
base_url = "" # Same backbone endpoint used by the SWE-Pruner Pro service
api_key_env = "QWEN_CODER_API_KEY"
opencode_context_limit = 131072
opencode_output_limit = 8192

[agent_diet_auxiliary]
model_id = "gpt-5-mini"
base_url = "" # API base; /chat/completions is appended
api_key_env = "AGENT_DIET_API_KEY"

# Empty values request automatic image preparation during real execution.
[images]
mini = ""
trae = ""
codex = ""
opencode = ""
verifier = ""

[runtime_paths]
python_executable = "/opt/tokenana/bin/python"
mini_executable = "/opt/tokenana/mini"
trae_executable = "/opt/tokenana/trae-cli"
codex_executable = "/opt/tokenana/codex"
codex_controlled_executable = "/opt/tokenana/codex-controlled"
opencode_executable = "/opt/tokenana/opencode"
opencode_config_root = "/opt/tokenana/opencode-config"
verifier_python = "/opt/tokenana/bin/python"

# Prepared services; these sections are required only for selected methods.
[methods.attn_compress]
service_base_url = "" # Deploy methods.attn_compress.service:create_app with the original model configuration
timeout = 600

[methods.swe_pruner_pro]
service_base_url = ""
backend_base_url = "" # Same SGLang base URL as models.qwen_coder_next
backbone = "Qwen3-Coder-Next"
head_model = "Qwen3-Coder-Next"
head = "/models/qwen3-coder-next-head" # Existing best_model.pt and model_config.json
timeout = 600

[verified_evaluation]
jobs = 4
python = "/opt/tokenana/bin/python"
namespace = "swebench"
