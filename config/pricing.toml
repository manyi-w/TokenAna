# API token list-price estimates, not gateway invoices. Edit freely for new runs.
# Runs freeze this configuration in pricing.json; reprice saved runs explicitly.
version = 1
currency = "USD"
cny_per_usd = "7"
checked_at = "2026-09-20"

[[models]]
name = "gpt-5.6-sol"
provider = "openai"
aliases = ["gpt-5.6-sol", "openai/gpt-5.6-sol"]
currency = "USD"
region = "global-standard"
rule = "cache_write"
input = "4"
cache_read = "0.40"
cache_write = "5"
output = "20"
long_context_threshold = 272000
long_input_multiplier = "2"
long_output_multiplier = "1.5"
source = "https://developers.openai.com/api/docs/models/gpt-5.6-sol"

[[models]]
name = "claude-opus-5"
provider = "anthropic"
aliases = ["claude-opus-5", "openai/claude-opus-5", "anthropic/claude-opus-5"]
currency = "USD"
region = "global-standard"
rule = "cache_ttl"
input = "5"
cache_read = "0.50"
cache_write_5m = "6.25"
cache_write_1h = "10"
output = "25"
source = "https://platform.claude.com/docs/en/about-claude/pricing"

[[models]]
name = "deepseek-v4.1-flash"
provider = "deepseek"
aliases = ["deepseek-flash", "deepseek-v4.1-flash", "deepseek-v4-flash", "deepseek-v4-flash-vision-exp"]
currency = "USD"
region = "official-peak-fixed"
rule = "cache_read"
input = "0.30"
cache_read = "0.006"
output = "1.20"
source = "https://api-docs.deepseek.com/quick_start/pricing/"

[[models]]
name = "qwen3.8-max"
provider = "dashscope"
aliases = ["qwen3.8-max", "qwen3.8-max-0902", "qwen3.8-max-2026-09-02"]
currency = "CNY"
region = "cn-beijing"
rule = "qwen_cache"
input = "12"
cache_read_implicit = "1.5"
cache_read_explicit = "1"
cache_write = "15"
output = "36"
source = "https://help.aliyun.com/zh/model-studio/qwen3-8-max"

[[models]]
name = "gpt-5-mini"
provider = "openai"
aliases = ["gpt-5-mini", "openai/gpt-5-mini"]
currency = "USD"
region = "global-standard"
rule = "cache_read"
input = "0.25"
cache_read = "0.025"
output = "2"
source = "https://developers.openai.com/api/docs/models/gpt-5-mini"
