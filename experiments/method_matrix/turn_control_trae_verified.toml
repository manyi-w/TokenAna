# Offline planning template. Requires separately prepared services/executors/dependencies.
[model]
path = "../../models/gpt-5.6-sol.toml"
base_url = "http://127.0.0.1:8000/v1"

[method]
path = "../../methods/turn_control"
[method.options]
budget_profile = "gpt"

[agent]
path = "../../agents/trae"
[agent.options]
executable = "/opt/tokenana/trae"
record_raw_usage = true
session_timeout = 900
python_executable = "/opt/tokenana/bin/python"

[dataset]
path = "../../datasets/swe_bench_verified"
[dataset.options]
limit = 10
