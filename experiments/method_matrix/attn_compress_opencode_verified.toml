# Offline planning template. Requires separately prepared services/executors/dependencies.
[model]
path = "../../models/gpt-5.6-sol.toml"
base_url = "http://127.0.0.1:8000/v1"

[method]
path = "../../methods/attn_compress"
[method.options]
service_base_url = "http://127.0.0.1:8003"

[agent]
path = "../../agents/opencode"
[agent.options]
executable = "/opt/tokenana/opencode"
record_raw_usage = true
session_timeout = 900
config_root = "/opt/tokenana/opencode-config"
context_limit = 131072
output_limit = 8192

[dataset]
path = "../../datasets/swe_bench_verified"
[dataset.options]
limit = 10
