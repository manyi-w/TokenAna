# Offline planning template. Requires separately prepared services/executors/dependencies.
[model]
path = "../../models/gpt-5.6-sol.toml"
base_url = "http://127.0.0.1:8000/v1"

[method]
path = "../../methods/agent_diet"
[method.options]
helper_model = "gpt-5-mini"
helper_base_url = "http://127.0.0.1:8002/v1"
helper_api_key_env = "AGENTDIET_API_KEY"

[agent]
path = "../../agents/trae"
[agent.options]
executable = "/opt/tokenana/trae"
record_raw_usage = true
session_timeout = 900
python_executable = "/opt/tokenana/bin/python"

[dataset]
path = "../../datasets/deepswe"
