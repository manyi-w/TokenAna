# Offline planning template. Requires separately prepared services/executors/dependencies.
[model]
path = "../../models/qwen3-coder-next-sglang.toml"
base_url = "http://127.0.0.1:30000/v1"

[method]
path = "../../methods/swe_pruner_pro"
[method.options]
service_base_url = "http://127.0.0.1:8001"
backend_base_url = "http://127.0.0.1:30000"
backbone = "Qwen3-Coder-Next"
head_model = "Qwen3-Coder-Next"
head = "/opt/tokenana/heads/qwen3-coder-next"

[agent]
path = "../../agents/mini_swe_agent"
[agent.options]
executable = "/opt/tokenana/mini-swe-agent"
record_raw_usage = true
session_timeout = 900
python_executable = "/opt/tokenana/bin/python"

[dataset]
path = "../../datasets/deepswe"
