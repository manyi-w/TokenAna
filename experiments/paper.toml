version = 1
name = "Rethinking the evaluation of code agents token saving methods"
pricing = "../config/pricing.toml"

[expected]
configurations = 109
task_runs = 12278

[datasets.deepswe]
tasks = "../config/studies/deepswe-113.txt"
count = 113

[datasets.verified]
tasks = "../config/studies/verified-100.txt"
count = 100

[execution]
generation_attempts = 1
http_retries = "native"
validation_jobs = 4
measurement_jobs = 1
cache_policy = "provider-native; identical agent settings within each comparison"

[analysis]
accounting = "corrected-v2-api"
preserve_accounting = ["original", "corrected-v1"]
denominator = "selected"
bootstrap_samples = 10000
bootstrap_seed = 20260921
bootstrap_unit = "repository"
confidence = 0.95
no_cache_discount_sensitivity = true
verified_savings = false

[[groups]]
name = "deepswe-general"
dataset = "deepswe"
methods = ["baseline", "run_free", "turn_control", "agent_diet", "attn_compress", "eet"]
agents = ["mini", "trae", "opencode"]
models = ["gpt-5.6-sol", "claude-opus-5", "deepseek-v4.1-flash", "qwen3.8-max"]
baseline = true

[[groups]]
name = "deepswe-general-codex"
dataset = "deepswe"
methods = ["baseline", "run_free", "turn_control", "agent_diet", "attn_compress", "eet"]
agents = ["codex"]
models = ["gpt-5.6-sol"]
baseline = true

[[groups]]
name = "deepswe-common-model"
dataset = "deepswe"
methods = ["baseline", "run_free", "turn_control", "agent_diet", "attn_compress", "eet", "swe_pruner_pro"]
agents = ["mini", "trae", "opencode", "codex"]
models = ["Qwen3-Coder-Next"]
baseline = true

[[groups]]
name = "verified-run-free"
dataset = "verified"
methods = ["run_free"]
agents = ["trae"]
models = ["claude-opus-5"]
baseline = false

[[groups]]
name = "verified-turn-control-agent-diet"
dataset = "verified"
methods = ["turn_control", "agent_diet"]
agents = ["trae"]
models = ["gpt-5.6-sol"]
baseline = false
