# Runtime for run_free_codex_verified_live.toml.
# Each image must already contain /testbed at the task base commit and the
# /opt/tokenana/codex binary built from agents/codex/upstream/codex-rs.
network = "host"
command_prefix = ["/opt/miniconda3/bin/conda", "run", "--no-capture-output", "-n", "testbed"]

[images]
"astropy__astropy-12907" = "swebench/sweb.eval.x86_64.astropy_1776_astropy-12907-agent:latest"
"astropy__astropy-13033" = "swebench/sweb.eval.x86_64.astropy_1776_astropy-13033-agent:latest"
"astropy__astropy-13236" = "swebench/sweb.eval.x86_64.astropy_1776_astropy-13236-agent:latest"
"astropy__astropy-13398" = "swebench/sweb.eval.x86_64.astropy_1776_astropy-13398-agent:latest"
"astropy__astropy-13453" = "swebench/sweb.eval.x86_64.astropy_1776_astropy-13453-agent:latest"
"astropy__astropy-13579" = "swebench/sweb.eval.x86_64.astropy_1776_astropy-13579-agent:latest"
"astropy__astropy-13977" = "swebench/sweb.eval.x86_64.astropy_1776_astropy-13977-agent:latest"
"astropy__astropy-14096" = "swebench/sweb.eval.x86_64.astropy_1776_astropy-14096-agent:latest"
"astropy__astropy-14182" = "swebench/sweb.eval.x86_64.astropy_1776_astropy-14182-agent:latest"
"astropy__astropy-14309" = "swebench/sweb.eval.x86_64.astropy_1776_astropy-14309-agent:latest"

[environment]
OPENAI_API_KEY = "tokenana-fake"
OPENAI_BASE_URL = "http://127.0.0.1:8000/v1"
CODEX_MODEL = "gpt-5.2"
CODEX_DISABLE_ANALYTICS = "1"
