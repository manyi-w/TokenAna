# Prepared Linux image containing upstream Trae and its Python dependencies required.
[model]
path = "../models/gpt-5.6-sol.toml"
base_url = "http://127.0.0.1:8000/v1"

[method]
path = "../methods/turn_control"
[method.options]
budget_profile = "gpt"

[agent]
path = "../agents/trae"
[agent.options]
executable = "/opt/tokenana/trae-cli"
python_executable = "/opt/tokenana/bin/python"
timeout = 1200
record_raw_usage = true

[dataset]
path = "../datasets/swe_bench_verified_subset"
[dataset.options]
limit = 10
