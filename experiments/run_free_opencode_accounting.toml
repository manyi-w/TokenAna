# Prepared Linux image, bundled SDKs and authorized fake model service required.
[model]
path = "../models/gpt-5.6-sol.toml"
base_url = "http://127.0.0.1:8000/v1"

[method]
path = "../methods/run_free"

[agent]
path = "../agents/opencode"

[agent.options]
executable = "/opt/tokenana/opencode"
config_root = "/opt/tokenana/opencode-config"
# Supply context_limit and output_limit for the selected model before running.
# config_root/opencode must be read-only and contain only a prepared .gitignore.
timeout = 1200
record_raw_usage = true

[dataset]
path = "../datasets/swe_bench_verified"

[dataset.options]
limit = 10
