# Requires separately prepared Linux images and an authorized fake Responses service.
[model]
path = "../models/gpt-5.6-sol.toml"
base_url = "http://127.0.0.1:8000/v1"

[method]
path = "../methods/run_free"

[agent]
path = "../agents/codex"

[agent.options]
executable = "/opt/tokenana/codex"
timeout = 1200
record_raw_usage = true

[dataset]
path = "../datasets/swe_bench_verified"

[dataset.options]
limit = 10
