# Linux x86_64 live configuration. The selected images are built by
# scripts/build_tokenana_codex_images.sh from agents/codex/upstream/codex-rs.
[method]
path = "../methods/run_free"

[agent]
path = "../agents/codex"

[agent.options]
executable = "/opt/tokenana/codex"
timeout = 1200
model = "gpt-5.2"
model_provider = "tokenana-fake"
model_base_url = "http://127.0.0.1:8000/v1"
wire_api = "responses"

[dataset]
path = "../datasets/swe_bench_verified"

[dataset.options]
limit = 10
