# Static template: no runtime, build, service or model verification has been performed.
# Endpoint is an example for a separately authorized local service; it is not started here.
[model]
path = "../../models/gpt-5.6-sol.toml"
base_url = "http://127.0.0.1:8000/v1"

[method]
path = "../../methods/run_free"

[agent]
path = "../../agents/mini_swe_agent"

[agent.options]
executable = "/opt/tokenana/mini"
record_raw_usage = true
# No agent timeout override: use each task's native agent.timeout_sec.

[dataset]
path = "../../datasets/deepswe"

[dataset.options]
languages = ["python"]
# Optional task_ids selects within languages; limit applies AFTER filtering and ID sorting.
