# Static template: no runtime, build, service or model verification has been performed.
# Endpoint is an example for a separately authorized local service; it is not started here.
[model]
path = "../../models/gpt-5.6-sol.toml"
base_url = "http://127.0.0.1:8000/v1"

[method]
path = "../../methods/run_free_multilingual"

[agent]
path = "../../agents/opencode"

[agent.options]
executable = "/opt/tokenana/opencode"
config_root = "/opt/tokenana/opencode-config"
# REQUIRED: supply actual positive context_limit/output_limit for your model.
# context_limit = ...
# output_limit = ...
# config_root/opencode must be pre-created read-only with only .gitignore.
record_raw_usage = true
# No agent timeout override: use each task's native agent.timeout_sec.

[dataset]
path = "../../datasets/deepswe"

[dataset.options]
languages = ["go", "typescript", "javascript", "rust"]
# Optional task_ids selects within languages; limit applies AFTER filtering and ID sorting.
