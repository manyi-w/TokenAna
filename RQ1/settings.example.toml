# Copy to settings.toml. Prepared image references only; no installation/build.
# Credentials stay in environment variables, never in this file.
verifier_image = "tokenana-verified-evaluator:latest"
verifier_python = "/opt/tokenana/bin/python"
channel_python = "/opt/tokenana/bin/python"

[run_free]
endpoint = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"
# Original per-task *-agent:latest images are matched by task id unless listed below.

[turn_control]
endpoint = "https://generativelanguage.googleapis.com"
api_key_env = "GOOGLE_API_KEY"
python_executable = "/opt/tokenana/bin/python"
executable = "/opt/tokenana/bin/trae-cli"

[agent_diet]
# Preserve the author's OpenAI-compatible transport and its actual usage fields.
endpoint = "https://generativelanguage.googleapis.com/v1beta/openai"
api_key_env = "GOOGLE_API_KEY"
helper_endpoint = "https://api.openai.com/v1"
helper_api_key_env = "OPENAI_API_KEY"

[attn_compress]
endpoint = "https://generativelanguage.googleapis.com"
api_key_env = "GOOGLE_API_KEY"
official_keys_env = "GEMINI_API_KEYS"
compression_endpoint = "http://127.0.0.1:46405"
# Start observed original service in its prepared GPU environment:
# TOKENANA_ATTN_MODEL_PATH=/models/Qwen3-4B-Instruct-2507 \
# uvicorn methods.attn_compress.service:create_app --factory --port 46405

# Optional exact per-task prepared image mapping. Every selected task must be
# prepared at its base commit. Diet/Attn images include the author's tools Python
# at /home/swe-bench/conda_envs/py312/bin/python3. Turn images include native Trae.
[images.run_free]
[images.turn_control]
[images.agent_diet]
[images.attn_compress]
